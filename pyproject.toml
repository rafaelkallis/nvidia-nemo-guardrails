[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvidia-nemo-guardrails"
version = "0.1.0"
description = "Self-hosted guardrail layer (NeMo Guardrails) in front of a self-hosted vLLM LLM."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["guardrails", "llm", "vllm", "nemo", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Dependencies needed only to run the local OpenAI-compatible mock that the
# CI smoke test runs against (ci/mock_openai_server.py).
mock = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "hatchling>=1.25",
    "PyYAML>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
