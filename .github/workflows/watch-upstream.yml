name: watch-upstream

# Watches NVIDIA-NeMo/Guardrails STABLE git tags (vX.Y.Z, e.g. v0.23.0) and
# triggers a rebuild of the overlay image to the matching Docker tag.
#
# GitHub does not expose another repo's tag/release events, so this runs on a
# schedule. It lists upstream tags, and dispatches build.yml for any STABLE
# tag whose image is not yet present in GHCR as the exact `:v<version>` tag.
# `latest` is re-pointed by the build whenever a new stable tag is built.

on:
  # Default: every 6 hours. Adjust the cron expression below to taste.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  UPSTREAM_REPO: NVIDIA-NeMo/Guardrails
  GCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `packages: read` lets GITHUB_TOKEN log in to GHCR and inspect whether
      # the `:v<version>` image already exists.
      packages: read
      # `actions: write` is required to dispatch build.yml via workflow_dispatch
      # from this scheduled workflow (GITHUB_TOKEN otherwise lacks the action
      # "Resource not accessible by integration").
      actions: write
    outputs:
      new_tag: ${{ steps.newest-tag.outputs.tag }}
    steps:
      - name: Checkout our repo
        uses: actions/checkout@v6

      # Resolve the newest STABLE upstream git tag (strict vX.Y.Z, no -rc*).
      # Requires a PAT to avoid anonymous API rate limits on the runner.
      - name: Get newest stable upstream tag
        id: newest-tag
        run: |
          AUTH=""
          if [[ -n "${{ secrets.UPSTREAM_RELEASES_TOKEN }}" ]]; then
            AUTH="-H Authorization: token ${{ secrets.UPSTREAM_RELEASES_TOKEN }}"
          fi
          TAG="$(curl -sfL $AUTH \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=100" \
            | jq -r '[.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first')"
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "No stable upstream tag found"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Newest stable upstream tag: $TAG"

      # Check whether our GHCR image is already tagged :VERSION (exact tag,
      # no upstream- prefix). Uses docker manifest inspect against the OCI
      # registry directly (no packages REST API / rate-limit issues).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image tag already exists
        id: exists
        env:
          TAG: ${{ steps.newest-tag.outputs.tag }}
        run: |
          echo "Checking $GCR_IMAGE:$TAG"
          if docker manifest inspect "$GCR_IMAGE:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch build for new stable upstream tag
        if: steps.exists.outputs.exists == 'false' && steps.newest-tag.outputs.tag != ''
        uses: actions/github-script@v8
        with:
          script: |
            const tag = '${{ steps.newest-tag.outputs.tag }}';
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yml',
                ref: context.ref || 'main',
                inputs: { upstream_tag: tag },
              });
              console.log(`Dispatched build for upstream ${tag}`);
            } catch (e) {
              console.log(`Dispatch skipped (already running or error): ${e.message}`);
              core.setFailed(`Failed to dispatch build for ${tag}: ${e.message}`);
            }

      - name: Summary
        run: |
          echo "Checked upstream: ${{ steps.newest-tag.outputs.tag }}"
          echo "Already built:   ${{ steps.exists.outputs.exists }}"
